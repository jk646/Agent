name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -trimpath ./cmd/shell-tool
      - run: CGO_ENABLED=0 go build -trimpath ./cmd/shell-tool-console
      - run: CGO_ENABLED=0 go build -trimpath ./cmd/file-tool
      - run: CGO_ENABLED=0 go build -trimpath ./cmd/file-tool-console
